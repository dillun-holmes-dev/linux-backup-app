name: Build Linux releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi gir1.2-gtk-4.0 \
            libgdk-pixbuf2.0-bin ibus-gtk4 restic rclone curl file xvfb xauth
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          source_version="$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' src/my_backups/metadata.py)"
          test "v$source_version" = "${GITHUB_REF_NAME}"
      - name: Run tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Build native release
        env:
          ARCH: ${{ matrix.arch }}
        run: ./packaging/build-release.sh
      - name: Test embedded runtime
        run: |
          ./dist/VaultLeafBackup-${{ matrix.arch }}.AppImage --appimage-extract-and-run --version
          ./dist/VaultLeafBackup-${{ matrix.arch }}.AppImage --appimage-extract-and-run --self-test
          xvfb-run -a ./dist/VaultLeafBackup-${{ matrix.arch }}.AppImage \
            --appimage-extract-and-run --ui-test
      - name: Sign checksum manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          test -n "$MINISIGN_SECRET_KEY"
          signing_key="$(mktemp)"
          trap 'shred -u "$signing_key" 2>/dev/null || true' EXIT
          printf '%s' "$MINISIGN_SECRET_KEY" >"$signing_key"
          packaging/build/AppDir/usr/bin/minisign -S -W \
            -s "$signing_key" \
            -m "dist/SHA256SUMS-${{ matrix.arch }}" \
            -x "dist/SHA256SUMS-${{ matrix.arch }}.minisig" \
            -t "VaultLeaf Backup ${GITHUB_REF_NAME} ${{ matrix.arch }}"
          packaging/build/AppDir/usr/bin/minisign -Vm \
            "dist/SHA256SUMS-${{ matrix.arch }}" \
            -x "dist/SHA256SUMS-${{ matrix.arch }}.minisig" \
            -p src/my_backups/data/vaultleaf-minisign.pub
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*${{ matrix.arch }}*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VaultLeafBackup-${{ matrix.arch }}
          path: dist/*${{ matrix.arch }}*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/*.AppImage dist/*-portable.tar.gz; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
